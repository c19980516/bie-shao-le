# ============================================================================
# dsh-cost-budget —— DSH bundle patch
# ============================================================================
# 插件的"挂载声明" + 配置层。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件把成本预算插件插入 profile 的配置树。
#
# 安装（在插件仓库根目录打开 PowerShell）：
#   $pluginPath = (Get-Location).Path
#   dsh plugin --profile web add "link:$pluginPath"
# 卸载：
#   dsh plugin --profile web remove dsh-cost-budget
# 改完配置需要重启 dsh web 生效。
# ============================================================================

- insert:
    - id: dsh-cost-budget
      name: dsh-cost-budget
      config:
        # ── 阶梯：累积包络语义 ──────────────────────────────────────────────
        # "到 until 时刻为止，当日**累计**消费不得超过 cap 元"。
        # 边界到达时上限跳变放宽，不"补花"。次日北京 00:00 归零。
        ladder:
          - { until: "10:00", cap: 5 }
          - { until: "11:00", cap: 10 }
          - { until: "12:00", cap: 15 }
          - { until: "14:00", cap: 25 }
          - { until: "16:00", cap: 30 }
          - { until: "24:00", cap: 40 }

        # ── 峰谷时段（北京时间，整点，[起, 止) 半开区间）────────────────────
        # 只影响"按什么单价折算"，与上面的阶梯判定完全无关。
        peakHours: [[9, 12], [14, 18]]

        # ── 未知模型策略 ────────────────────────────────────────────────────
        # warn-and-fallback = 按 deepseek-flash 价兜底并告警
        # deny              = 跳过计量（该笔不计入，会低估；不会阻止模型调用）
        unknownModelPolicy: warn-and-fallback

        # ── 跨进程账本锁的等待上限（毫秒）──────────────────────────────────
        # 默认 30000。锁竞争时最长等这么久，超时该次记账失败（会告警）。
        ledgerWaitMs: 30000

        # ── 干跑模式 ────────────────────────────────────────────────────────
        # true  = 只记账和显示预算，不拦工具/模型，不暂停或自动恢复 goal
        # false = 触顶时真正硬停
        # 建议先跑一天 true，核对账本金额与实际花费是否吻合，再改 false。
        #
        # 随附配置默认启用试跑，便于先核对预算与实际消费。
        # 此模式下 /dsh-cost-budget/state.json 里的 allowed 恒为 true、
        # exhausted 恒为 false；budgetAllowed 仍显示真实预算是否充足。
        # 取消预算恢复定时器；此前已暂停的任务保持暂停，可手动恢复。
        # 想恢复硬停：把下面改回 false。
        dryRun: true

        # ── 额度模式 ────────────────────────────────────────────────────────
        # total = 所有 provider 合并成一个额度（默认，旧行为）
        # group = 按 providerGroups 分组，**每组各有一套阶梯、各算各的**
        #
        # 两种常见诉求都由此覆盖：
        #   · "按 provider 分别统计" → group 模式 + 每个 provider 自己一组
        #   · "某几个 provider 合并成一个额度" → group 模式 + 它们同组
        quotaMode: total
        # estimated = 当日 token 估算（支持 total/group）
        # observed  = 当前档位的账户余额下降累计（仅支持 total）
        # observed 余额缺失/过期/错账户或币种时回退当天 token 估算。
        spendSource: estimated
        providerGroups: {}
        # 例如：
        # quotaMode: group
        # providerGroups:
        #   official: [deepseek-official]
        #   gateway: [example-gateway]
        # groupCapScale:      # 每组对阶梯上限的倍率，默认 1.0
        #   gateway: 0.5      # gateway 组只有阶梯一半的额度

        # ── 推定缓存命中率（扩展点，默认不折算）─────────────────────────────
        # provider → 命中率(0–1)。只对**不上报 cacheReadTokens** 的网关生效
        # （已上报时不会重复折算，有测试钉住）。
        #
        # ★ 默认留空：不要用它去"对齐官方账单"。
        #   官方账单只能核对同一计费账户、同一时间范围内的请求。
        #   独立计费网关不能拿另一个账户的账单反推命中率。
        #   provider 名和路由均由宿主配置决定，示例名称不代表实际账户。
        #
        #   只有在你能**独立证明**某个网关确实存在缓存命中、只是没上报时，
        #   才按你自己的证据填写。
        assumedHitRatio: {}
        # ── 余额观测 ────────────────────────────────────────────────────────
        # 读取官方余额，把**余额下降额**累计为观测消费。
        # 余额属于整个计费账户，可能包含其他客户端的使用。
        #
        # ★ 适用范围：仅覆盖接口返回的计费账户。
        #   独立计费的网关（例如 example-gateway）需使用其自己的数据或 token 估算。
        #   余额观测和 token 估算两类口径不要直接相加或互相校准。
        #
        # 默认 enabled: true、poll: true，每 60 秒尝试读取官方凭证并请求余额。
        # dryRun 不会关闭轮询。关闭余额功能：enabled: false；
        # 只读取已有观测账本、不读取凭证或联网：poll: false。
        # 默认预算判据仍为 token 估算；余额判据见 README 的 spendSource 说明。
        #
        # key 从 ~/.dsh/.credentials.yaml 按名读取，**不写进配置文件**。
        balance:
          enabled: true
          poll: true
          url: https://api.deepseek.com/user/balance
          keyRef: DEEPSEEK_API_KEY
          pollMs: 60000
          # 默认 max(3 * pollMs, 180000)；最低 15000 毫秒。
          maxAgeMs: 180000
          scope: deepseek

        # ── 边界恢复的续跑门槛 ──────────────────────────────────────────────
        # 各组余量都达到各自上限的这个百分比才恢复 goal，由宿主调度续跑。
        # 不足时保持暂停，下一档再检查；只恢复本插件暂停且未被修改的任务。
        # 设为 0 表示预算未触顶即可恢复。
        resumeMinHeadroomPct: 15

        # ── 通知（保留配置，当前未实现）──────────────────────────────────────
        # 改成 true 也不会发送桌面通知或小鲸鱼提示。
        notify:
          browser: false
          whale: false

        # ── 调试档（保持注释即安全）─────────────────────────────────────────
        # 用来在 1 分钟内走完"触顶硬停 → 时钟跨档 → 自动恢复"，不必真等到整点。
        # 用途仅限验证；打开前想清楚：它会强制触顶，从而**拒绝你自己的所有工具**。
        #   timeOffsetMs:        判定时钟整体平移（毫秒）
        #   forceSpentCny:       强制一个"已花金额"，高于当前档上限即立刻硬停
        #   treatBoundaryAsInMs: 把"距下一边界"编成 N 毫秒 → N 毫秒后重判
        #   stepClockMs:         每次重判把判定时钟再往前推，用来模拟跨档
        # debug:
        #   timeOffsetMs: 0
        #   forceSpentCny: null
        #   treatBoundaryAsInMs: null
        #   stepClockMs: 0
